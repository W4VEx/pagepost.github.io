<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมสร้างใบปะหน้าส่งสินค้า</title>
    <link rel="stylesheet" href="style.css">

<script type="text/javascript" src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
<script type="text/javascript" src="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dependencies/JQL.min.js"></script>
<script type="text/javascript" src="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dependencies/typeahead.bundle.js"></script>
    
    <link rel="stylesheet" href="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dist/jquery.Thailand.min.css">
<script type="text/javascript" src="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dist/jquery.Thailand.min.js"></script>
            
   
</head>
<body>
    <div class="container">
        <div class="sender">
            <h2>ชื่อผู้ส่งสินค้า</h2>
            <p>ชื่อผู้ส่ง</p><input id="nsen" type="text" placeholder="ชื่อผู้ส่ง"/>
            <p>ที่อยู่ผู้ส่ง</p>
            <form class="address">
                <input type="txt" class="ntxt" placeholder="เลขที่บ้าน หมู่">
                
                    <span>ตำบล</span><input  type="text" id="district" class="txt" placeholder="ตำบล"/>
                    <span>อำเภอ/เขต</span><input id="amphoe" type="text" class="txt" placeholder="อำเภอ"/>
                    <span>จังหวัด</span><input id="province" type="text" class="txt" placeholder="จังหวัด"/>
                    <span>รหัสไปรษณีย์</span><input id="zipcode" type="text" class="txt" placeholder="รหัสไปรษณีย์"/>
            </form>    
            <p>เบอร์โทรผู้ส่ง</p><input id="senphone" class="senphone" type="text" placeholder="เบอร์โทรผู้ส่ง"/>
        
        </div>

          
        <div class="receiver">
            <h2>ชื่อผู้รับสินค้า</h2>
            <p>ชื่อผู้รับ</p><input id="recna" type="text" placeholder="ชื่อผู้รับ"/>
            <p>ที่อยู่ผู้รับ</p>

            <form class="address">
                <input type="txt" class="ntxt" placeholder="เลขที่บ้าน หมู่">
                
                    <span>ตำบล</span><input id="district2" type="text" class="txt" placeholder="ตำบล"/>
                    <span>อำเภอ/เขต</span><input id="amphoe2" type="text" class="txt" placeholder="อำเภอ"/>
                    <span>จังหวัด</span><input id="province2" type="text" class="txt" placeholder="จังหวัด"/>
                    <span>รหัสไปรษณีย์</span><input id="zipcode2" type="text" class="txt" placeholder="รหัสไปรษณีย์"/>


                
                
            </form>   
            <p>เบอร์โทรผู้รับ</p><input id="revphone" type="text" placeholder="เบอร์โทรผู้รับ"/>  
        </div>

    </div>

    <div id="show" class="submit"> Submit </div>


    <div class="container2">
          <div id="shsen" >
             <!-- ชื่อผู้ส่ง -->
            <span id="showname" class="showsen"></span>  
            <!-- ที่อยู่ผู้ส่ง -->
            <span id="showaddress" class="showsen"></span>
            <!-- เบอร์โทรผู้้ส่ง -->
            <span id="showphone" class="showsen"></span>

          </div>

         
          <div id="shrec" >
             <!-- ชื่อผู้รับ -->
            <span id="shownamerec" class="showrev"></span>  
            <!-- ที่อยู่ผู้รับ -->
            <span id="showaddrev" class="showrev"></span>
            <!-- เบอร์โทรผู้รับ -->
            <span id="showphonerev" class="showrev"></span>

          </div>


    </div>


</div>

<script src="script.js"></script>
 <script>
$.Thailand({
    $district: $('#district'), // input ของตำบล
    $amphoe: $('#amphoe'), // input ของอำเภอ
    $province: $('#province'), // input ของจังหวัด
    $zipcode: $('#zipcode'), // input ของรหัสไปรษณีย์
});

$.Thailand({
    $district: $('#district2'), // input ของตำบล
    $amphoe: $('#amphoe2'), // input ของอำเภอ
    $province: $('#province2'), // input ของจังหวัด
    $zipcode: $('#zipcode2'), // input ของรหัสไปรษณีย์
});




</script>

 



</body>
</html>
